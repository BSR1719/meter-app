<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSR Energy Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0b1120; --surface:#111827; --card:#1a2235; --border:#1e2d45;
  --ok:#10b981; --warn:#f59e0b; --danger:#ef4444; --info:#3b82f6;
  --text:#f1f5f9; --muted:#64748b; --dim:#334155;
  --mono:'IBM Plex Mono',monospace; --thai:'Sarabun',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--thai);}
body{padding:0 0 60px;}

/* ── Top bar ── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
.logo{width:32px;height:32px;border:1.5px solid var(--ok);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.title-block h1{font-size:15px;font-weight:600;color:var(--text);}
.title-block p{font-size:11px;color:var(--muted);font-family:var(--mono);}
.refresh-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:var(--thai);transition:all .2s;}
.refresh-btn:hover{border-color:var(--ok);color:var(--ok);}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.page{padding:20px;max-width:1400px;margin:0 auto;}

/* ── KPI Cards ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.kpi.ok::before{background:var(--ok);}
.kpi.warn::before{background:var(--warn);}
.kpi.danger::before{background:var(--danger);}
.kpi.info::before{background:var(--info);}
.kpi-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.kpi-val{font-size:26px;font-weight:700;font-family:var(--mono);line-height:1;}
.kpi-unit{font-size:11px;color:var(--muted);margin-top:4px;}
.kpi-badge{font-size:10px;padding:2px 8px;border-radius:4px;margin-top:8px;display:inline-block;}
.badge-ok{background:rgba(16,185,129,.15);color:var(--ok);}
.badge-warn{background:rgba(245,158,11,.15);color:var(--warn);}
.badge-danger{background:rgba(239,68,68,.15);color:var(--danger);}

/* ── Section title ── */
.section-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:24px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* ── Hospital bar chart ── */
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:24px;}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.chart-title{font-size:13px;font-weight:600;}
.avg-line-label{font-size:10px;color:var(--warn);font-family:var(--mono);}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:140px;overflow-x:auto;padding-bottom:4px;}
.bar-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:28px;flex:1;max-width:48px;}
.bar-outer{width:100%;background:var(--border);border-radius:4px 4px 0 0;position:relative;display:flex;align-items:flex-end;}
.bar-fill{width:100%;border-radius:4px 4px 0 0;transition:height .6s cubic-bezier(.4,0,.2,1);position:relative;}
.bar-fill.normal{background:linear-gradient(180deg,#10b981,#059669);}
.bar-fill.warn{background:linear-gradient(180deg,#f59e0b,#d97706);}
.bar-fill.danger{background:linear-gradient(180deg,#ef4444,#dc2626);}
.bar-fill.no-data{background:var(--dim);}
.avg-marker{position:absolute;left:0;right:0;border-top:1.5px dashed var(--warn);pointer-events:none;}
.bar-day{font-size:9px;color:var(--muted);font-family:var(--mono);}
.bar-val{font-size:8px;color:var(--muted);font-family:var(--mono);}

/* ── Heatmap ── */
.heatmap-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:24px;overflow-x:auto;}
.heatmap-title{font-size:13px;font-weight:600;margin-bottom:16px;}
.heatmap-table{border-collapse:collapse;width:100%;min-width:700px;}
.heatmap-table th{font-size:9px;color:var(--muted);font-family:var(--mono);padding:4px 3px;text-align:center;font-weight:400;}
.heatmap-table td{padding:2px 3px;}
.floor-label{font-size:11px;color:var(--text);padding:4px 10px 4px 0;white-space:nowrap;text-align:right;font-weight:500;}
.heat-cell{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8px;font-family:var(--mono);color:rgba(255,255,255,.7);cursor:default;transition:transform .1s;}
.heat-cell:hover{transform:scale(1.3);z-index:10;position:relative;}
.heat-empty{background:var(--dim);}
.heat-low{background:#064e3b;}
.heat-normal{background:#065f46;}
.heat-mid{background:#047857;}
.heat-high{background:#b45309;}
.heat-danger{background:#991b1b;}

/* ── Alert table ── */
.alert-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:24px;}
.alert-title{font-size:13px;font-weight:600;margin-bottom:14px;}
.alert-table{width:100%;border-collapse:collapse;}
.alert-table th{font-size:10px;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);}
.alert-table td{font-size:12px;padding:8px 10px;border-bottom:1px solid rgba(30,45,69,.5);}
.alert-table tr:last-child td{border-bottom:none;}
.floor-chip{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;font-family:var(--mono);}
.pct-danger{color:var(--danger);font-family:var(--mono);font-weight:600;}
.pct-warn{color:var(--warn);font-family:var(--mono);font-weight:600;}
.empty-state{text-align:center;padding:32px;color:var(--muted);font-size:13px;}
.ok-icon{font-size:32px;margin-bottom:8px;}

/* ── Legend ── */
.legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);}
.leg-box{width:12px;height:12px;border-radius:2px;}

/* ── Loading ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:12px;color:var(--muted);}
.spinner{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--ok);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Threshold control ── */
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
.ctrl-label{font-size:11px;color:var(--muted);}
.ctrl-input{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 10px;font-size:12px;font-family:var(--mono);width:70px;}
.ctrl-btn{background:var(--info);border:none;color:#fff;border-radius:6px;padding:5px 14px;font-size:12px;cursor:pointer;font-family:var(--thai);}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round">
      <circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M11.5 3.1l-1.4 1.4M4.5 11.5l-1.4 1.4"/>
    </svg>
  </div>
  <div class="title-block">
    <h1>BSR Energy Dashboard</h1>
    <p id="subtitle">กำลังโหลดข้อมูล...</p>
  </div>
  <div class="status-dot" id="status-dot" style="background:var(--warn)"></div>
  <button class="refresh-btn" onclick="loadData()">↻ รีเฟรช</button>
</div>

<div class="page">
  <div id="main-content">
    <div class="loading" id="loading-state">
      <div class="spinner"></div>
      <span>กำลังดึงข้อมูลจาก Google Sheets...</span>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════
// CONFIG — ใส่ URL ของ Apps Script
// ══════════════════════════════════════
const API_URL = 'https://script.google.com/macros/s/AKfycbxPcGrZHye3lVzlqpLJJFOr3YSbAhyoJQqmHfdlebvF3vkmjeufsjiPPtGS5iNAyhcV/exec';

let THRESHOLD = 0.10; // 10% above avg = warning
let rawData = null;

const FLOOR_COLORS = {
  'G':'#0099ff','1':'#7b61ff','2':'#ff6b9d','3':'#ff9500',
  '4old':'#34c759','4new':'#30d158','5old':'#00d4aa','5new':'#00c7be',
  '6':'#ffd60a','7':'#ff9f0a','8':'#ff6961','9':'#bf5af2','10':'#ff375f'
};

const MONTHS_TH = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.',
                   'ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

async function loadData() {
  document.getElementById('loading-state') && showLoading();
  try {
    const res = await fetch(API_URL + '?action=dashboard', {mode:'cors'});
    const data = await res.json();
    rawData = data;
    renderAll(data);
    document.getElementById('status-dot').style.background = 'var(--ok)';
  } catch(err) {
    showError(err.toString());
    document.getElementById('status-dot').style.background = 'var(--danger)';
  }
}

function showLoading() {
  document.getElementById('main-content').innerHTML =
    '<div class="loading"><div class="spinner"></div><span>กำลังดึงข้อมูล...</span></div>';
}

function showError(msg) {
  document.getElementById('main-content').innerHTML =
    `<div class="loading"><span style="color:var(--danger)">❌ เกิดข้อผิดพลาด: ${msg}</span></div>`;
}

function renderAll(data) {
  const hosp = data.hospital || [];
  const floors = data.floors || [];

  // ดึงเฉพาะวันที่มีข้อมูล
  const validDays = hosp.map((v,i)=>({day:i+1,val:v})).filter(d=>d.val && d.val > 0);
  const validVals = validDays.map(d=>d.val);
  const avg = validVals.length ? validVals.reduce((a,b)=>a+b,0)/validVals.length : 0;
  const max = validVals.length ? Math.max(...validVals) : 0;
  const today = validDays[validDays.length-1];

  // KPIs
  const anomalyFloors = getAnomalyFloors(floors, validDays.length > 0 ? validDays[validDays.length-1].day : 0);

  document.getElementById('subtitle').textContent =
    `${MONTHS_TH[data.month]} ${data.year} | อัปเดต: ${new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}`;

  const totalDays = validDays.length;
  const dangerDays = validDays.filter(d=>d.val > avg*(1+THRESHOLD)).length;

  let html = '';

  // Controls
  html += `<div class="controls">
    <span class="ctrl-label">Threshold ผิดปกติ:</span>
    <input class="ctrl-input" type="number" id="threshold-input" value="${Math.round(THRESHOLD*100)}" min="5" max="50" step="5"> %
    <button class="ctrl-btn" onclick="applyThreshold()">ปรับ</button>
    <span class="ctrl-label" style="margin-left:8px;">ข้อมูล ${totalDays} วัน</span>
  </div>`;

  // KPI Cards
  html += `<div class="kpi-grid">
    <div class="kpi ${today && today.val > avg*(1+THRESHOLD) ? 'danger' : 'ok'}">
      <div class="kpi-label">วันล่าสุด</div>
      <div class="kpi-val">${today ? today.val.toLocaleString('th-TH',{maximumFractionDigits:0}) : '—'}</div>
      <div class="kpi-unit">kWh (วันที่ ${today ? today.day : '—'})</div>
      ${today ? `<span class="kpi-badge ${today.val > avg*(1+THRESHOLD) ? 'badge-danger' : 'badge-ok'}">${today.val > avg*(1+THRESHOLD) ? '⚠ สูงกว่าเฉลี่ย' : '✓ ปกติ'}</span>` : ''}
    </div>
    <div class="kpi info">
      <div class="kpi-label">ค่าเฉลี่ย/วัน</div>
      <div class="kpi-val">${avg ? avg.toLocaleString('th-TH',{maximumFractionDigits:0}) : '—'}</div>
      <div class="kpi-unit">kWh</div>
    </div>
    <div class="kpi ${dangerDays > 0 ? 'warn' : 'ok'}">
      <div class="kpi-label">วันที่ผิดปกติ</div>
      <div class="kpi-val">${dangerDays}</div>
      <div class="kpi-unit">จาก ${totalDays} วัน</div>
      <span class="kpi-badge ${dangerDays > 0 ? 'badge-warn' : 'badge-ok'}">${dangerDays > 0 ? `${Math.round(dangerDays/totalDays*100)}% ของเดือน` : 'ทุกวันปกติ'}</span>
    </div>
    <div class="kpi ${anomalyFloors.length > 0 ? 'danger' : 'ok'}">
      <div class="kpi-label">ชั้นผิดปกติวันนี้</div>
      <div class="kpi-val">${anomalyFloors.length}</div>
      <div class="kpi-unit">ชั้น</div>
      <span class="kpi-badge ${anomalyFloors.length > 0 ? 'badge-danger' : 'badge-ok'}">${anomalyFloors.length > 0 ? anomalyFloors.slice(0,3).map(f=>f.name).join(', ') : 'ทุกชั้นปกติ'}</span>
    </div>
    <div class="kpi ok">
      <div class="kpi-label">Max วันเดียว</div>
      <div class="kpi-val">${max ? max.toLocaleString('th-TH',{maximumFractionDigits:0}) : '—'}</div>
      <div class="kpi-unit">kWh</div>
    </div>
  </div>`;

  // Bar chart — hospital daily
  html += `<div class="chart-card">
    <div class="chart-header">
      <span class="chart-title">⚡ kWh รวม รพ. รายวัน</span>
      <span class="avg-line-label">--- เฉลี่ย ${avg ? avg.toLocaleString('th-TH',{maximumFractionDigits:0}) : 0} kWh</span>
    </div>
    <div class="bar-chart" id="bar-chart"></div>
  </div>`;

  // Heatmap
  html += `<div class="heatmap-card">
    <div class="heatmap-title">🔥 Heatmap การใช้ไฟแยกรายชั้น — สีแดง = สูงกว่าเฉลี่ยชั้นนั้น +${Math.round(THRESHOLD*100)}%</div>
    <div class="legend">
      <div class="leg-item"><div class="leg-box" style="background:#064e3b"></div> ต่ำมาก</div>
      <div class="leg-item"><div class="leg-box" style="background:#047857"></div> ปกติ</div>
      <div class="leg-item"><div class="leg-box" style="background:#b45309"></div> สูง</div>
      <div class="leg-item"><div class="leg-box" style="background:#991b1b"></div> ผิดปกติ</div>
      <div class="leg-item"><div class="leg-box" style="background:var(--dim)"></div> ไม่มีข้อมูล</div>
    </div>
    <div id="heatmap-container"></div>
  </div>`;

  // Alert table
  html += `<div class="alert-card">
    <div class="alert-title">🚨 ชั้นที่ผิดปกติ — วันล่าสุด (วันที่ ${today ? today.day : '—'})</div>
    <div id="alert-table"></div>
  </div>`;

  document.getElementById('main-content').innerHTML = html;

  // Render bar chart
  renderBarChart(validDays, avg);

  // Render heatmap
  renderHeatmap(floors, validDays.length);

  // Render alert table
  renderAlertTable(anomalyFloors, avg);
}

function renderBarChart(validDays, avg) {
  const container = document.getElementById('bar-chart');
  if (!container) return;
  const max = Math.max(...validDays.map(d=>d.val), avg*(1+THRESHOLD)*1.1);

  let html = '';
  validDays.forEach(d => {
    const pct = max > 0 ? (d.val/max*100) : 0;
    const avgPct = max > 0 ? (avg/max*100) : 0;
    const cls = d.val > avg*(1+THRESHOLD) ? 'danger' : d.val > avg*1.05 ? 'warn' : 'normal';
    html += `<div class="bar-wrap">
      <div class="bar-val">${d.val >= 1000 ? (d.val/1000).toFixed(1)+'k' : Math.round(d.val)}</div>
      <div class="bar-outer" style="height:110px;">
        <div class="bar-fill ${cls}" style="height:${pct}%;width:100%;"></div>
        <div class="avg-marker" style="bottom:${avgPct}%;"></div>
      </div>
      <div class="bar-day">${d.day}</div>
    </div>`;
  });
  container.innerHTML = html;
}

function renderHeatmap(floors, totalDays) {
  const container = document.getElementById('heatmap-container');
  if (!container) return;

  // headers
  let th = '<th class="floor-label">ชั้น</th>';
  for (let d = 1; d <= 31; d++) th += `<th>${d}</th>`;

  let rows = '';
  floors.forEach(fl => {
    const validVals = fl.days.filter(v => v !== null && v > 0);
    const flAvg = validVals.length ? validVals.reduce((a,b)=>a+b,0)/validVals.length : 0;
    const flMax = validVals.length ? Math.max(...validVals) : 0;
    const color = FLOOR_COLORS[fl.id] || '#888';

    let cells = `<td class="floor-label"><span style="color:${color};font-weight:600;">${fl.name}</span></td>`;
    for (let d = 0; d < 31; d++) {
      const v = fl.days[d];
      if (v === null || v === 0) {
        cells += `<td><div class="heat-cell heat-empty" title="วันที่${d+1}: ไม่มีข้อมูล"></div></td>`;
      } else {
        let cls = 'heat-normal';
        const ratio = flAvg > 0 ? v/flAvg : 0;
        if (ratio < 0.7) cls = 'heat-low';
        else if (ratio < 1.05) cls = 'heat-normal';
        else if (ratio < 1.10) cls = 'heat-mid';
        else if (ratio < 1+THRESHOLD) cls = 'heat-high';
        else cls = 'heat-danger';
        const pctStr = flAvg > 0 ? `${ratio >= 1 ? '+' : ''}${Math.round((ratio-1)*100)}%` : '';
        cells += `<td><div class="heat-cell ${cls}" title="วันที่${d+1}: ${Math.round(v).toLocaleString()} kWh (${pctStr})">${pctStr ? pctStr : ''}</div></td>`;
      }
    }
    rows += `<tr>${cells}</tr>`;
  });

  container.innerHTML = `<table class="heatmap-table"><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table>`;
}

function getAnomalyFloors(floors, lastDay) {
  if (!lastDay) return [];
  const idx = lastDay - 1;
  const result = [];
  floors.forEach(fl => {
    const validVals = fl.days.filter(v => v !== null && v > 0);
    if (!validVals.length) return;
    const flAvg = validVals.reduce((a,b)=>a+b,0)/validVals.length;
    const todayVal = fl.days[idx];
    if (todayVal && todayVal > flAvg*(1+THRESHOLD)) {
      result.push({
        ...fl,
        todayVal,
        flAvg,
        pct: (todayVal/flAvg - 1)*100
      });
    }
  });
  return result.sort((a,b)=>b.pct-a.pct);
}

function renderAlertTable(anomalies, hospAvg) {
  const container = document.getElementById('alert-table');
  if (!container) return;

  if (!anomalies.length) {
    container.innerHTML = `<div class="empty-state"><div class="ok-icon">✅</div>ทุกชั้นใช้ไฟในระดับปกติ</div>`;
    return;
  }

  let rows = '';
  anomalies.forEach(fl => {
    const color = FLOOR_COLORS[fl.id] || '#888';
    rows += `<tr>
      <td><span class="floor-chip" style="background:${color}22;color:${color}">${fl.name}</span></td>
      <td style="font-family:var(--mono)">${Math.round(fl.todayVal).toLocaleString()} kWh</td>
      <td style="font-family:var(--mono)">${Math.round(fl.flAvg).toLocaleString()} kWh</td>
      <td><span class="pct-danger">+${fl.pct.toFixed(1)}%</span></td>
      <td style="font-size:11px;color:var(--muted)">สูงกว่าค่าเฉลี่ยชั้น ${fl.pct.toFixed(1)}% — ควรตรวจสอบ</td>
    </tr>`;
  });

  container.innerHTML = `<table class="alert-table">
    <thead><tr><th>ชั้น</th><th>วันนี้</th><th>ค่าเฉลี่ย</th><th>% ต่างจากเฉลี่ย</th><th>หมายเหตุ</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function applyThreshold() {
  const val = parseInt(document.getElementById('threshold-input').value) || 10;
  THRESHOLD = val/100;
  if (rawData) renderAll(rawData);
}

// Auto load
loadData();
// Auto refresh ทุก 5 นาที
setInterval(loadData, 5*60*1000);
</script>
</body>
</html>
